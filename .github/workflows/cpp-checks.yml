name: C++ Checks

on:
  # Do not add a pull_request path filter here. These jobs are required branch
  # protection contexts and must be emitted even for docs-only pull requests.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cpp-checks.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "examples/**"
      - "external/cpp/**"
      - "scripts/package-python-worker.ps1"
      - "scripts/assemble-portable-release.ps1"
      - "scripts/assemble-native-portable-release.ps1"
      - "scripts/audit-native-dependencies.py"
      - "scripts/setup-python-packaging.ps1"
      - "scripts/test-portable-python-worker-cpp.ps1"
      - "scripts/test-portable-user-cli.ps1"
      - "scripts/run-native-python-matrix.ps1"
      - "scripts/validate-acceptance-receipts.py"
      - "tests/validate_acceptance_receipts_test.py"
      - "docs/acceptance-receipt.schema.json"
      - "docs/reports/acceptance-index.json"
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "docs/native-qwentts-worker.md"
      - "docs/native-portable-package.md"

permissions:
  contents: read

concurrency:
  group: cpp-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-evidence:
    name: Acceptance evidence contract
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical receipts and regression cases
        shell: pwsh
        run: |
          python tests/validate_acceptance_receipts_test.py
          python scripts/validate-acceptance-receipts.py

  windows:
    name: Windows MSVC (${{ matrix.name }})
    runs-on: windows-2022
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            build-dir: build/default
            build-examples: "ON"
            build-native: "OFF"
            build-speech-animation: "OFF"
          - name: no-examples
            build-dir: build/no-examples
            build-examples: "OFF"
            build-native: "OFF"
            build-speech-animation: "OFF"
          - name: native-worker
            build-dir: build/native-worker
            build-examples: "OFF"
            build-native: "ON"
            build-speech-animation: "OFF"
          - name: speech-animation
            build-dir: build/speech-animation
            build-examples: "OFF"
            build-native: "OFF"
            build-speech-animation: "ON"
          - name: speech-animation-player
            build-dir: build/speech-animation-player
            build-examples: "ON"
            build-native: "OFF"
            build-speech-animation: "ON"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B "${{ matrix.build-dir }}"
          -G "Visual Studio 17 2022" -A x64
          -DQWEN_TTS_BRIDGE_BUILD_EXAMPLES=${{ matrix.build-examples }}
          -DQWEN_TTS_BRIDGE_BUILD_QWENTTS_WORKER=${{ matrix.build-native }}
          -DQWEN_TTS_BRIDGE_BUILD_SPEECH_ANIMATION=${{ matrix.build-speech-animation }}
          -DQWEN_TTS_BRIDGE_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build "${{ matrix.build-dir }}" --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir "${{ matrix.build-dir }}" -C Release --output-on-failure

      - name: Install package and run consumer smoke
        if: ${{ matrix.name == 'default' }}
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'qwen-tts-bridge-install'
          cmake --install build/default --config Release --prefix $prefix
          .\scripts\test-installed-package.ps1 `
            -InstallPrefix $prefix `
            -BuildDirectory (Join-Path $env:RUNNER_TEMP 'qwen-tts-bridge-install-consumer') `
            -RequireTtsFront `
            -RequireWinmmPlayback

      - name: Parse native/Python matrix runner
        if: ${{ matrix.name == 'default' }}
        shell: pwsh
        run: >
          [void][System.Management.Automation.Language.Parser]::ParseFile(
          'scripts/run-native-python-matrix.ps1', [ref]$null, [ref]$null)

      - name: Parse native packaging runner
        if: ${{ matrix.name == 'default' }}
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/assemble-native-portable-release.ps1',
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { $_.Message }
            throw 'Native packaging runner failed PowerShell parsing.'
          }

      - name: Install portable worker packaging tooling
        if: ${{ matrix.build-examples == 'ON' }}
        shell: pwsh
        run: .\scripts\setup-python-packaging.ps1 -Python python

      - name: Package portable Python worker
        if: ${{ matrix.build-examples == 'ON' }}
        shell: pwsh
        run: .\scripts\package-python-worker.ps1 -Python python -Clean

      - name: Smoke-test portable worker through C++ transport
        if: ${{ matrix.build-examples == 'ON' }}
        shell: pwsh
        run: >
          .\scripts\test-portable-python-worker-cpp.ps1
          -Python python
          -ExampleExe "${{ matrix.build-dir }}\Release\qwen_tts_save_wav.exe"

      - name: Assemble complete portable CLI release
        if: ${{ matrix.build-examples == 'ON' }}
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'QwenTTSBridge-release'
          .\scripts\assemble-portable-release.ps1 `
            -PythonPackageRoot dist/QwenTTSBridge `
            -SaveWavExecutable "${{ matrix.build-dir }}\Release\qwen_tts_save_wav.exe" `
            -PlayExecutable "${{ matrix.build-dir }}\Release\qwen_tts_play.exe" `
            -OutputRoot $release `
            -Python python

      - name: Exercise relocated qwen-tts CLI through C++ and mock worker
        if: ${{ matrix.build-examples == 'ON' }}
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'QwenTTSBridge-release'
          $acceptance = Join-Path $env:RUNNER_TEMP 'qwen-tts-cli-acceptance'
          .\scripts\test-portable-user-cli.ps1 `
            -PackageRoot $release `
            -OutputRoot $acceptance `
            -Python python

      - name: Preserve portable CLI mock evidence
        if: ${{ always() && matrix.build-examples == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-cli-mock-${{ matrix.name }}
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/qwen-tts-cli-acceptance/cli-acceptance-summary.json
            ${{ runner.temp }}/qwen-tts-cli-acceptance/.invoke-*
            ${{ runner.temp }}/qwen-tts-cli-acceptance/результаты/*

  native-abi:
    name: Windows native qwentts ABI
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Initialize nested native submodules
        shell: pwsh
        run: git submodule update --init --recursive external/cpp/qwentts.cpp

      - name: Configure native backend
        shell: pwsh
        run: >
          cmake -S . -B build/native-qwentts
          -G "Visual Studio 17 2022" -A x64
          -DQWEN_TTS_BRIDGE_BUILD_NATIVE_BACKEND=ON
          -DQWEN_TTS_BRIDGE_BUILD_EXAMPLES=OFF
          -DQWEN_TTS_BRIDGE_BUILD_TESTS=ON
          -DGGML_CUDA=OFF

      - name: Reconfigure native backend (cache regression)
        shell: pwsh
        run: >
          cmake -S . -B build/native-qwentts
          -G "Visual Studio 17 2022" -A x64
          -DQWEN_TTS_BRIDGE_BUILD_NATIVE_BACKEND=ON
          -DQWEN_TTS_BRIDGE_BUILD_EXAMPLES=OFF
          -DQWEN_TTS_BRIDGE_BUILD_TESTS=ON
          -DGGML_CUDA=OFF

      - name: Build native ABI smoke-test
        shell: pwsh
        run: >
          cmake --build build/native-qwentts --config Release
          --parallel

      - name: Run native ABI and contract tests
        shell: pwsh
        run: >
          ctest --test-dir build/native-qwentts -C Release --output-on-failure
