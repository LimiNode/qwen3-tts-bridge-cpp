- module-name: 'qwen_tts.inference.qwen3_tts_model' # checksum: 47eb8996
  anti-bloat:
    - description: 'disable voice-clone audio loading in narrow Qwen packaging profiles'
      replacements_plain:
        "def _librosa():\n    return import_module(\"librosa\")": "def _librosa():\n    raise RuntimeError(\"librosa is packaged only by -QwenProfile VoiceClone\")"
        "def _soundfile():\n    return import_module(\"soundfile\")": "def _soundfile():\n    raise RuntimeError(\"soundfile is packaged only by -QwenProfile VoiceClone\")"
        "def _transformers_auto_classes():\n    transformers = import_module(\"transformers\")\n    return transformers.AutoConfig, transformers.AutoModel, transformers.AutoProcessor": "def _transformers_auto_classes():\n    from transformers.models.auto.configuration_auto import AutoConfig\n    from transformers.models.auto.modeling_auto import AutoModel\n    from transformers.models.auto.processing_auto import AutoProcessor\n\n    return AutoConfig, AutoModel, AutoProcessor"

